interface:
  display_name: "Inspect Revit on Windows"
  short_description: "Audit Revit with compact Windows MCP reads"
  default_prompt: "Use $inspect-revit to inspect the active Revit model on Windows 11."
dependencies:
  tools:
    - type: "mcp"
      value: "revit-mcp-next"
      description: "Revit MCP Next local stdio server"
      transport: "stdio"
policy:
  allow_implicit_invocation: true

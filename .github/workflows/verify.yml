name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Codex plugin
        shell: powershell
        run: python scripts/validate_codex_plugin.py plugins/revit-mcp-cowork
      - name: Run offline learning tests
        shell: powershell
        run: python -m unittest discover -s tests -v
      - name: Validate JSON
        shell: powershell
        run: |
          Get-Content .agents/plugins/marketplace.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content plugins/revit-mcp-cowork/.codex-plugin/plugin.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content plugins/revit-mcp-cowork/.mcp.json -Raw | ConvertFrom-Json | Out-Null
      - name: Reject stale or non-Windows integration
        shell: powershell
        run: |
          $stale = Get-ChildItem plugins/revit-mcp-cowork -Recurse -File | Select-String -Pattern 'mcp-server-for-revit|send_code_to_revit|ai_element_filter'
          if ($stale) { throw "Stale Revit MCP integration found." }
          $mcp = Get-Content plugins/revit-mcp-cowork/.mcp.json -Raw | ConvertFrom-Json
          $server = $mcp.mcpServers.'revit-mcp-next'
          if ($server.command -ne 'cmd.exe') { throw "Revit MCP launcher must remain Windows-only." }
          if ($server.type -ne 'stdio' -or $server.cwd -ne '.') { throw "Revit MCP must remain a plugin-relative stdio server." }

          $wrapper = Get-Content plugins/revit-mcp-cowork/scripts/launch-revit-mcp-next.cmd -Raw
          if ($wrapper -notmatch '(?m)^call "%LAUNCHER%"') { throw "Revit wrapper must hand off with CALL." }
          if ($wrapper -match '(?m)^cmd /c ') { throw "Revit wrapper must not spawn a redundant cmd.exe process." }
